<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arrow Escape">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F172A">
<title>Arrow Escape</title>
<style>
  :root{
    --bg:#0F172A; --panel:#1E293B; --text:#E2E8F0; --muted:#94A3B8;
    --line:#334155; --outer:#020617;
    --accent:#22C55E; --blue:#3B82F6; --amber:#F59E0B; --red:#EF4444;
  }
  html[data-theme="light"]{
    --bg:#F1F5F9; --panel:#FFFFFF; --text:#0F172A; --muted:#64748B;
    --line:#CBD5E1; --outer:#CBD5E1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:var(--outer);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none;touch-action:manipulation}
  #app{position:relative;margin:0 auto;height:100dvh;max-width:430px;max-height:932px;background:var(--bg);
    display:flex;flex-direction:column;overflow:hidden;transition:background .25s}
  @media (min-width:500px){
    #app{margin-top:max(0px,calc((100dvh - 932px)/2));border-radius:36px;box-shadow:0 0 0 8px rgba(17,24,39,.55),0 20px 60px rgba(0,0,0,.45)}
  }
  header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 6px}
  .lvl{font-size:21px;font-weight:700;letter-spacing:.2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
  .hearts{font-size:22px;letter-spacing:4px;min-width:90px;flex:none;text-align:right;color:var(--red)}
  .sub{display:flex;justify-content:space-between;padding:0 18px 4px;color:var(--muted);font-size:14px}
  #stage{flex:1;position:relative;margin:6px 0}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  footer{display:flex;gap:10px;padding:8px 14px calc(env(safe-area-inset-bottom,0px) + 16px)}
  button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:13px 10px;font-size:15px;font-weight:600;flex:1;cursor:pointer;transition:transform .08s,background .25s}
  button:active{transform:scale(.96);filter:brightness(1.08)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#04210f}
  button.small{flex:0 0 auto;padding:13px 18px}
  button.big{padding:17px 10px;font-size:17px;border-radius:16px;width:100%;flex:none}
  #toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:var(--panel);
    border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;color:var(--text);
    opacity:0;pointer-events:none;transition:opacity .25s;text-align:center;max-width:86%;z-index:7}
  #toast.show{opacity:1}
  #overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(2,6,23,.6);backdrop-filter:blur(4px);z-index:6}
  #overlay.show{display:flex}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px 24px;width:82%;text-align:center}
  .card h2{margin:0 0 8px;font-size:26px}
  .card p{margin:0 0 18px;color:var(--muted);font-size:15px;line-height:1.45}
  .card button{display:block;width:100%}
  .card button + button{margin-top:10px}
  .stars{font-size:34px;letter-spacing:6px;margin-bottom:10px;color:var(--amber)}
  .streak{color:var(--amber);font-weight:700;margin-bottom:14px}
  .earn{color:var(--amber);font-weight:700;margin-bottom:14px}

  /* home */
  #home{position:absolute;inset:0;z-index:4;background:var(--bg);display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:24px 26px calc(env(safe-area-inset-bottom,0px) + 24px);gap:12px;text-align:center;transition:background .25s}
  #home.hide{display:none}
  #home h1{margin:6px 0 0;font-size:36px;letter-spacing:.3px}
  #home .tag{margin:0 0 12px;color:var(--muted);font-size:15px}
  #home .coins{color:var(--amber);font-weight:700;font-size:16px;margin:0 0 6px}
  #home .row{display:flex;gap:10px;width:100%}
  #home .row button{padding:13px 6px;font-size:14px}
  #home .row button,#home .row select{flex:1;min-width:0}
  #home .row button{white-space:normal;line-height:1.2}
  select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:13px 6px;font-size:14px;font-weight:600;cursor:pointer;appearance:none;-webkit-appearance:none;
    text-align:center;text-align-last:center}
  select option{background:var(--panel);color:var(--text)}
  #hDaily small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:3px}
  #home .modes{display:flex;gap:10px;width:100%}
  #home .modes button{padding:14px 6px;line-height:1.25;min-width:0}
  #home .modes button b{display:block;font-size:18px}
  #home .modes button small{display:block;font-weight:600;font-size:12px;margin-top:4px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  button.blue{background:var(--blue);border-color:var(--blue);color:#fff}
  button.ghost{background:transparent;border-style:dashed;color:var(--muted);font-size:13px;padding:10px}
  .card{max-height:90%;overflow-y:auto}
  .card h3{margin:16px 0 8px;font-size:14px;color:var(--muted);font-weight:600}
  textarea{font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;color:var(--text);background:var(--bg);border:1px solid var(--line);
    border-radius:10px;padding:8px;width:100%;height:76px;resize:none;user-select:text;-webkit-user-select:text;margin:0 0 10px;display:block}
  @media (max-height:720px){ #home svg{width:70px;height:70px} #home h1{font-size:30px} #home{gap:9px} #home .tag{margin-bottom:6px} }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="lvl" id="lvl">Level 1</div>
    <div class="hearts" id="hearts"></div>
  </header>
  <div class="sub"><span id="left"></span><span id="best"></span></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="toast"></div>
  <footer>
    <button id="btnHint"></button>
    <button id="btnRestart"></button>
    <button id="btnHome" class="small" aria-label="Home">⌂</button>
  </footer>

  <div id="home">
    <svg width="110" height="110" viewBox="0 0 120 120" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 34 H70" stroke="#38BDF8" stroke-width="10"/><path d="M66 22 L90 34 L66 46 Z" fill="#38BDF8" stroke="#38BDF8" stroke-width="4"/>
      <path d="M100 58 H52 V86" stroke="#34D399" stroke-width="10"/><path d="M40 82 L52 106 L64 82 Z" fill="#34D399" stroke="#34D399" stroke-width="4"/>
      <path d="M20 104 V76" stroke="#FBBF24" stroke-width="10"/><path d="M8 78 L20 54 L32 78 Z" fill="#FBBF24" stroke="#FBBF24" stroke-width="4"/>
    </svg>
    <h1>Arrow Escape</h1>
    <p class="tag" id="hTag"></p>
    <p class="coins" id="hCoins"></p>
    <div class="modes">
      <button class="primary" id="hPlay"></button>
      <button class="blue" id="hPlay3"></button>
    </div>
    <button class="big" id="hDaily"></button>
    <div class="row">
      <button id="hSound"></button>
      <button id="hTheme"></button>
    </div>
    <div class="row">
      <select id="hLang" aria-label="Language"></select>
      <button id="hHow"></button>
    </div>
    <button class="ghost big" id="hSave"></button>
  </div>

  <div id="overlay"><div class="card" id="card"></div></div>
</div>

const LIGHT3 = (() => { const v = [-0.4, 0.8, 0.6], l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; })();
function setRot(){}
function rotV(x, y, z){ const m = view.M; return [m[0]*x + m[1]*y + m[2]*z, m[3]*x + m[4]*y + m[5]*z, m[6]*x + m[7]*y + m[8]*z]; }
function proj3(S, x, y, z){
  const q = rotV(x - S.center[0], y - S.center[1], z - S.center[2]);
  const f = layout.persp / (layout.persp - q[2]);
  return [layout.cx + q[0] * f * layout.sc, layout.cy - q[1] * f * layout.sc, q[2], f];
}
function angDiff(a, b){ return Math.atan2(Math.sin(a - b), Math.cos(a - b)); }
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

// full path of an arrow: its own cells, the cells of its exit path (over glowing edges too), then a straight fly-off
function arrowNodes(S, a, marks){
  if (a._nodes) return a._nodes;
  const r = ray3(S, a, marks);
  const pc = a.cells.concat(r.cells), pd = a.dirs.concat(r.dirs);
  const N = [];
  for (let i = 0; i < pc.length; i++){
    const cc = S.cells[pc[i]], n = AX[cc.f];
    N.push([cc.v[0] + .5 * n[0], cc.v[1] + .5 * n[1], cc.v[2] + .5 * n[2]]);
    if (i < pc.length - 1){ const t = AX[pd[i]], q = N[N.length - 1]; N.push([q[0] + .5 * t[0], q[1] + .5 * t[1], q[2] + .5 * t[2]]); }
  }
  const last = N[N.length - 1], h = AX[r.headDir], cnt = 2 * (a.cells.length + 4) + 4;
  for (let j = 1; j <= cnt; j++) N.push([last[0] + h[0] * .5 * j, last[1] + h[1] * .5 * j, last[2] + h[2] * .5 * j]);
  const np = pc.length;
  return (a._nodes = { N, pc, owner: mid => clamp(Math.floor((mid + 1) / 2), 0, np - 1) });
}
function faceFill(shade){
  const lo = themeEff === 'light' ? [150, 166, 190] : [24, 34, 54], hi = themeEff === 'light' ? [236, 241, 248] : [88, 108, 140];
  return 'rgb(' + Math.round(lo[0] + (hi[0] - lo[0]) * shade) + ',' + Math.round(lo[1] + (hi[1] - lo[1]) * shade) + ',' + Math.round(lo[2] + (hi[2] - lo[2]) * shade) + ')';
}
function arrowStyle3(a, now, hintOn){
  let color = COLORS[a.color], alpha = hintOn && a.id !== game.pulse.id ? 0.25 : 1, jitter = 0;
  const fl = game.flashes.find(f => f.id === a.id);
  if (fl){
    const k = (now - fl.t0) / fl.dur;
    if (k >= 1) game.flashes = game.flashes.filter(f => f !== fl);
    else { color = '#EF4444'; alpha = 1; if (fl.shake) jitter = Math.sin(k * 28) * layout.sc * 0.08 * (1 - k); }
  }
  return { color, alpha, jitter };
}
function drawHead3(S, H, h, nrm, color, jitter){
  const s = [nrm[1] * h[2] - nrm[2] * h[1], nrm[2] * h[0] - nrm[0] * h[2], nrm[0] * h[1] - nrm[1] * h[0]];
  const L = 0.3, B = 0.07, W = 0.21, lift = 0.02;
  const pt = (a, b) => [H[0] + h[0] * a + s[0] * b + nrm[0] * lift, H[1] + h[1] * a + s[1] * b + nrm[1] * lift, H[2] + h[2] * a + s[2] * b + nrm[2] * lift];
  const tri = [pt(L, 0), pt(-B, W), pt(-B, -W)].map(q => proj3(S, q[0], q[1], q[2]));
  ctx.fillStyle = color; ctx.beginPath();
  tri.forEach((q, j) => j ? ctx.lineTo(q[0] + jitter, q[1]) : ctx.moveTo(q[0] + jitter, q[1]));
  ctx.closePath(); ctx.fill();
}
// the part of a resting arrow that lies on cell k (drawn right after that cell's face, so depth order stays right)
function drawPiece3(a, k, now, hintOn){
  const S = game.S, N = arrowNodes(S, a, game.marks).N, n = a.cells.length;
  const st = arrowStyle3(a, now, hintOn);
  const lo = Math.max(0, 2 * k - 1), hi = Math.min(2 * (n - 1), 2 * k + 1);
  const pts = [];
  for (let j = lo; j <= hi; j++){ const q = proj3(S, N[j][0], N[j][1], N[j][2]); pts.push([q[0] + st.jitter, q[1], q[3]]); }
  const lw = layout.sc * pts[2 * k - lo][2] * 0.115;
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const path = () => { ctx.beginPath(); pts.forEach((q, j) => j ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.stroke(); };
  if (hintOn && a.id === game.pulse.id){
    ctx.globalAlpha = .4 + .3 * Math.sin(now / 130); ctx.strokeStyle = '#F59E0B'; ctx.lineWidth = lw * 2.7; path();
  }
  ctx.globalAlpha = st.alpha; ctx.strokeStyle = st.color; ctx.lineWidth = lw; path();
  if (k === n - 1) drawHead3(S, N[2 * k], AX[a.hd], AX[S.cells[a.cells[k]].f], st.color, st.jitter);
  ctx.restore();
}
// an arrow that is sliding (or bouncing): window of its path shifted by `off` nodes
function drawMoving3(a, off, color, alpha){
  const S = game.S, nd = arrowNodes(S, a, game.marks), N = nd.N, n = a.cells.length;
  const s0 = clamp(off, 0, N.length - 2), s1 = Math.min(N.length - 1, s0 + 2 * (n - 1));
  const at = s => { const i = Math.min(N.length - 2, Math.floor(s)), f = s - i, p = N[i], q = N[i + 1]; return [p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f, p[2] + (q[2] - p[2]) * f]; };
  const ss = [s0];
  for (let j = Math.floor(s0) + 1; j < s1 - 1e-6; j++) ss.push(j);
  ss.push(s1);
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.globalAlpha = alpha; ctx.strokeStyle = color;
  const P = ss.map(sv => { const w = at(sv); return proj3(S, w[0], w[1], w[2]); });
  for (let j = 0; j < ss.length - 1; j++){
    if (game.vz[nd.pc[nd.owner((ss[j] + ss[j + 1]) / 2)]] <= 0.04) continue;
    ctx.lineWidth = layout.sc * (P[j][3] + P[j + 1][3]) / 2 * 0.115;
    ctx.beginPath(); ctx.moveTo(P[j][0], P[j][1]); ctx.lineTo(P[j + 1][0], P[j + 1][1]); ctx.stroke();
  }
  const hi = clamp(Math.floor(s1 + 1e-6), 0, N.length - 2), ow = nd.pc[nd.owner(hi + 0.5)];
  if (game.vz[ow] > 0.04){
    let h = [N[hi + 1][0] - N[hi][0], N[hi + 1][1] - N[hi][1], N[hi + 1][2] - N[hi][2]];
    const L = Math.hypot(h[0], h[1], h[2]) || 1; h = [h[0] / L, h[1] / L, h[2] / L];
    drawHead3(S, at(s1), h, AX[S.cells[ow].f], color, 0);
  }
  ctx.restore();
}
// glowing edges where arrows continue onto the neighbouring face
function drawEdges3(now){
  const S = game.S;
  if (!game.edgeSegs.length) return;
  ctx.save(); ctx.lineCap = 'round';
  const pulse = 0.65 + 0.35 * Math.sin(now / 260);
  for (const sg of game.edgeSegs){
    if (!sg.cells.some(c => game.vz[c] > 0.04)) continue;
    const p = sg.p, q = sg.q, A = proj3(S, p[0], p[1], p[2]), B = proj3(S, q[0], q[1], q[2]);
    ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]);
    ctx.globalAlpha = 0.28 * pulse; ctx.strokeStyle = '#FBBF24'; ctx.lineWidth = layout.sc * A[3] * 0.2; ctx.stroke();
    ctx.globalAlpha = 0.95; ctx.strokeStyle = '#FDE68A'; ctx.lineWidth = layout.sc * A[3] * 0.065; ctx.stroke();
  }
  ctx.restore();
}
function draw3d(now, dt){
  const S = game.S, C = S.cells.length;
  if (!drag3){
    if (view.tgt){
      const T = view.tgt.M; let diff = 0;
      const M2 = view.M.map((v, i) => { diff += Math.abs(T[i] - v); return v + (T[i] - v) * 0.14; });
      view.M = diff < 0.02 ? T : orthoM(M2);
      if (diff < 0.02) view.tgt = null;
    } else if (Math.abs(view.vx) > 0.0004 || Math.abs(view.vy) > 0.0004){
      spin(view.vx, view.vy); view.vx *= 0.93; view.vy *= 0.93;
    }
  }
  setRot();
  const hintOn = game.pulse && !game.over;
  const front = [];
  for (let i = 0; i < C; i++){
    const cell = S.cells[i], n = AX[cell.f], nv = rotV(n[0], n[1], n[2]);
    game.vz[i] = nv[2];
    if (nv[2] <= 0.04) continue;
    front.push({ i, nv, P: proj3(S, cell.v[0] + .5 * n[0], cell.v[1] + .5 * n[1], cell.v[2] + .5 * n[2]) });
  }
  front.sort((a, b) => a.P[2] - b.P[2]);          // far -> near
  game.proj = [];
  ctx.lineJoin = 'round';
  for (const e of front){
    const i = e.i, cell = S.cells[i], n = AX[cell.f], k = cell.f >> 1, u = k === 0 ? 1 : 0, w = k === 2 ? 1 : 2;
    const bx = cell.v[0] + .5 * n[0], by = cell.v[1] + .5 * n[1], bz = cell.v[2] + .5 * n[2];
    ctx.beginPath();
    [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach((ab, j) => {
      const p = [bx, by, bz]; p[u] += ab[0] * 0.505; p[w] += ab[1] * 0.505;
      const q = proj3(S, p[0], p[1], p[2]);
      j ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]);
    });
    ctx.closePath();
    const shade = clamp(0.5 + 0.5 * (e.nv[0] * LIGHT3[0] + e.nv[1] * LIGHT3[1] + e.nv[2] * LIGHT3[2]), 0, 1);
    ctx.fillStyle = faceFill(shade); ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = ctx.fillStyle; ctx.stroke();
    // outline only where the surface really bends (no grid of little squares)
    ctx.strokeStyle = themeEff === 'light' ? 'rgba(51,65,85,.55)' : 'rgba(186,200,225,.4)'; ctx.lineWidth = 1.3;
    for (let d = 0; d < 6; d++){
      if ((d >> 1) === k) continue;
      const nx = S.nb[i][d]; if (nx.k === 0) continue;
      const t = AX[d], a3 = 3 - k - (d >> 1), p1 = [bx + .5 * t[0], by + .5 * t[1], bz + .5 * t[2]], p2 = p1.slice();
      p1[a3] -= .5; p2[a3] += .5;
      const q1 = proj3(S, p1[0], p1[1], p1[2]), q2 = proj3(S, p2[0], p2[1], p2[2]);
      ctx.beginPath(); ctx.moveTo(q1[0], q1[1]); ctx.lineTo(q2[0], q2[1]); ctx.stroke();
    }
    const id = game.occ[i];
    if (id !== -1){
      const a = game.arrows[id];
      if (e.nv[2] > 0.12) game.proj.push({ id, x: e.P[0], y: e.P[1], r: Math.max(16, layout.sc * e.P[3] * 0.72), z: e.P[2] });
      if (!a.anim && !a.bump && e.nv[2] > 0.1) drawPiece3(a, a.cells.indexOf(i), now, hintOn);
    }
  }
  drawEdges3(now);
  for (const a of game.arrows){
    if (a.removed || (!a.anim && !a.bump)) continue;
    if (a.anim){
      const k = (now - a.anim.t0) / a.anim.dur;
      if (k >= 1){ a.anim = null; a.removed = true; onArrowGone(); continue; }
      const ease = k * k * (3 - 2 * k) * 0.35 + k * 0.65;
      drawMoving3(a, ease * a.anim.total * 2, COLORS[a.color], k < 0.6 ? 1 : 1 - (k - 0.6) / 0.4);
    } else {
      const k = (now - a.bump.t0) / a.bump.dur;
      if (k >= 1){ a.bump = null; continue; }
      drawMoving3(a, a.bump.dist * Math.sin(Math.min(1, k) * Math.PI) * 2, COLORS[a.color], 1);
    }
  }
}
// turn the shape so that surface cell `ci` faces the player
function aimAt(ci){
  const n = AX[game.S.cells[ci].f], h = Math.hypot(n[0], n[2]);
  const yaw = h > 0.01 ? Math.atan2(-n[0], n[2]) + 0.45 : -0.7;
  view.tgt = { M: ypMat(yaw, clamp(Math.atan2(n[1], h) + 0.4, -1.3, 1.3)) };
  view.vx = view.vy = 0;
}

cv.addEventListener('pointerdown', e => {
  if (!game || game.kind !== '3d') return;
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  drag3 = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: false };
  view.vx = view.vy = 0; view.tgt = null;
});
cv.addEventListener('pointermove', e => {
  if (!drag3 || !game || game.kind !== '3d') return;
  if (!drag3.moved && Math.hypot(e.clientX - drag3.sx, e.clientY - drag3.sy) > 8) drag3.moved = true;
  if (drag3.moved){
    const dx = e.clientX - drag3.x, dy = e.clientY - drag3.y;
    spin(dx * 0.0095, dy * 0.0095);
    view.vx = dx * 0.0095; view.vy = dy * 0.0095;
  }
  drag3.x = e.clientX; drag3.y = e.clientY;
});
function endDrag3(e, cancel){
  if (!drag3) return;
  const d = drag3; drag3 = null;
  if (cancel || d.moved || !game || game.kind !== '3d' || game.over) return;
  const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  let best = null, bd = 1e9;
  for (const p of game.proj){
    const dist = Math.hypot(p.x - px, p.y - py);
    if (dist < p.r && (dist < bd - 3 || (Math.abs(dist - bd) <= 3 && p.z > best.z))){ bd = dist; best = p; }
  }
  if (best) tap(game.arrows[best.id]);
}
cv.addEventListener('pointerup', e => endDrag3(e, false));
cv.addEventListener('pointercancel', e => endDrag3(e, true));

// ============================== Input ==============================
cv.addEventListener('pointerdown', e => {
  if (!game || game.over || game.kind === '3d') return;
  const r = cv.getBoundingClientRect();
  const fx = (e.clientX - r.left - layout.ox) / layout.cell;
  const fy = (e.clientY - r.top - layout.oy) / layout.cell;
  const x = Math.floor(fx), y = Math.floor(fy);
  let id = -1;
  if (x >= 0 && y >= 0 && x < game.size && y < game.size) id = game.occ[y][x];
  if (id === -1){
    // forgiving hit test: nearest occupied cell within 0.9 cells of the tap
    let best = 0.9, bid = -1;
    for (const a of game.arrows){
      if (a.removed || a.anim) continue;
      for (const [cx2, cy2] of a.cells){
        const d = Math.hypot(cx2 + .5 - fx, cy2 + .5 - fy);
        if (d < best){ best = d; bid = a.id; }
      }
    }
    id = bid;
  }
  if (id === -1) return;
  tap(game.arrows[id]);
});

function tap(a){
  if (a.removed || a.anim) return;
  const blocker = curBlocker(a);
  const now = performance.now();
  game.pulse = null;
  if (blocker === -1){
    clearOcc(a);
    const ray = curRay(a).length;
    const total = ray + a.cells.length + 2;
    a.anim = { t0: now, total, dur: Math.max(380, total * 55) };
    a.bump = null;
    sfx.slide();
    saveProgress();
  } else {
    // bump: slide to the obstacle and bounce back
    let gap = 0;
    for (const r of curRay(a)){
      const o = occAtRef(r);
      if (o !== -1 && o !== a.id) break;
      gap++;
    }
    a.bump = { t0: now, dist: gap + 0.35, dur: 460 };
    game.lives--; game.lost++;
    game.flashes.push({ id: blocker, t0: now + 120, dur: 900, shake: true });
    toast(t('blocked'));
    sfx.bad();
    if (navigator.vibrate) try{ navigator.vibrate(60); }catch(e){}
    updateHUD();
    saveProgress();
    if (game.lives <= 0){ game.over = true; clearProgress(); const gf = game; setTimeout(() => { if (game === gf) showFail(); }, 650); }
  }
}

function onArrowGone(){
  updateHUD();
  saveProgress();
  if (!game.over && game.arrows.every(a => a.removed)){
    game.over = true;
    clearProgress();
    let earned = 0;
    if (game.mode === 'level3'){
      earned = WIN3_COINS + (game.lost === 0 ? PERFECT_BONUS : 0);
      if (level3 + 1 > bestLevel3){ bestLevel3 = level3 + 1; store.set('ae_best3', bestLevel3); }
      store.set('ae_level3', level3 + 1);
    } else if (game.mode === 'level'){
      earned = WIN_COINS + (game.lost === 0 ? PERFECT_BONUS : 0);
      if (level + 1 > bestLevel){ bestLevel = level + 1; store.set('ae_best', bestLevel); }
      store.set('ae_level', level + 1);
    } else {
      earned = DAILY_COINS;
      markDailyDone();
    }
    coins += earned; store.set('ae_coins', coins);
    game.earned = earned;
    spawnConfetti();
    sfx.win();
    const gw = game; setTimeout(() => { if (game === gw) showWin(); }, 450);
  }
}

// ============================== Buttons ==============================
function giveHint(auto){
  if (!game || game.over) return;
  const free = game.arrows.filter(a => !a.removed && !a.anim && curBlocker(a) === -1);
  if (!free.length) return;
  if (!auto){
    if (game.hints > 0) game.hints--;
    else if (coins >= HINT_COST){ coins -= HINT_COST; store.set('ae_coins', coins); }
    else { toast(t('nohint')); return; }
  }
  let pool = free;
  const headOf = x => x.cells[x.cells.length - 1];
  if (game.kind === '3d'){
    const vis = free.filter(x => (game.vz[headOf(x)] || 0) > 0.35);
    if (vis.length) pool = vis;
  }
  const a = pool[Math.floor(Math.random() * pool.length)];
  if (game.kind === '3d' && (game.vz[headOf(a)] || 0) <= 0.35) aimAt(headOf(a));
  game.pulse = { id: a.id, t0: performance.now() };  // stays until the player taps
  if (auto) toast(t('tapHint'), 2200);
  sfx.hint();
  updateHUD();
  saveProgress();
}

}

function showWin(){

      <div class="streak">🔥 ${t('streak')}: ${ds.streak} ${t('days')}</div>
      <button class="primary" id="ovBtn">${t('back')}</button>`);
    $('ovBtn').onclick = () => { sfx.click(); hideOverlay(); showHome(); };
  } else {
    showOverlay(`<div class="stars">${stars}</div><h2>${t('win')}</h2>${earn}
      <button class="primary" id="ovBtn">${t('next')}</button>`);
    $('ovBtn').onclick = () => { sfx.click(); hideOverlay(); if (game.mode === 'level3') startGame3(level3 + 1, true); else startGame('level', level + 1, true); };
  }
}
function showFail(){
  sfx.fail();
  const revive = coins >= REVIVE_COST ? `<button class="primary" id="ovRevive">${t('revive')} · ${REVIVE_COST} 🪙</button>` : '';
  showOverlay(`<h2>${t('fail')}</h2><p>🪙 ${coins}</p>${revive}
    <button id="ovBtn">${t('retry')}</button>`);
  if (coins >= REVIVE_COST) $('ovRevive').onclick = () => {
    coins -= REVIVE_COST; store.set('ae_coins', coins);
    game.over = false; game.lives = 1;
    sfx.coin(); hideOverlay(); updateHUD(); saveProgress();
  };
  $('ovBtn').onclick = () => { sfx.click(); hideOverlay(); restartCurrent(true); };
}

function maybeTutorial3(){
  store.set('ae_seen3', true);
  showOverlay(`<h2>🧊 3D</h2><p>${t('how3').replace(/\n/g, '<br>')}</p><button class="primary" id="ovBtn">${t('ok')}</button>`);
  $('ovBtn').onclick = () => { sfx.click(); hideOverlay(); toast(t('rotateHint'), 2200); };
}

// ============================== Progress code (backup / move to another device) ==============================
function collectProgress(){
  const n = (k, d) => store.get(k, d);   // what is saved on the device is the truth (e.g. a just-won level already points to the next one)
  return { lang, level: n('ae_level', level), best: n('ae_best', bestLevel), coins, theme: themeMode, mute: muted,
           level3: n('ae_level3', level3), best3: n('ae_best3', bestLevel3),
           streak: store.get('ae_streak', { last: -1, n: 0 }), daily: store.get('ae_daily', { day: -1, done: false }) };
}
function b64e(str){ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64d(str){ str = str.replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '='; return decodeURIComponent(escape(atob(str))); }
function codeHash(str){ let h = 2166136261; for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return ('00000' + (h >>> 0).toString(36)).slice(-5); }
function exportCode(){
  const body = b64e(JSON.stringify({ v: SAVE_VERSION, d: collectProgress() }));
  return 'AE' + SAVE_VERSION + '-' + body + '-' + codeHash(body);
}
function migrateData(d, v){ return d; }   // future: adapt codes exported by older versions here
function importCode(str){
  const m = /^AE(\d+)-([A-Za-z0-9_-]+)-([a-z0-9]{5})$/.exec(String(str).replace(/\s+/g, ''));
  if (!m || codeHash(m[2]) !== m[3]) return false;
  let o; try{ o = JSON.parse(b64d(m[2])); }catch(e){ return false; }
  if (!o || typeof o !== 'object' || !o.d || !(o.v <= SAVE_VERSION)) return false;
  const d = migrateData(o.d, o.v);
  const int = (x, min, def) => { x = Math.floor(Number(x)); return isFinite(x) && x >= min ? Math.min(x, 1e7) : def; };
  if (LANGS[d.lang]) store.set('ae_lang', d.lang);
  store.set('ae_level', int(d.level, 1, 1)); store.set('ae_best', int(d.best, 1, 1)); store.set('ae_coins', int(d.coins, 0, 0));
  store.set('ae_level3', int(d.level3, 1, 1)); store.set('ae_best3', int(d.best3, 1, 1));
  if (['auto', 'dark', 'light'].indexOf(d.theme) !== -1) store.set('ae_theme', d.theme);
  store.set('ae_mute', !!d.mute);
  if (d.streak && isFinite(d.streak.last) && isFinite(d.streak.n)) store.set('ae_streak', { last: +d.streak.last, n: int(d.streak.n, 0, 0) });
  if (d.daily && isFinite(d.daily.day)) store.set('ae_daily', { day: +d.daily.day, done: !!d.daily.done });
  store.set('ae_save', null); store.set('ae_save3', null); store.set('ae_ver', SAVE_VERSION);
  return true;
}
function showSave(){
  showOverlay(`<h2>${t('saveTitle')}</h2><p>${t('saveHint')}</p>
    <textarea id="svOut" readonly></textarea>
    <button class="primary" id="svCopy">${t('copy')}</button>
    <h3>${t('importHint')}</h3>
    <textarea id="svIn" placeholder="AE5-…"></textarea>
    <button id="svRestore">${t('importBtn')}</button>
    <button class="ghost" id="svClose">${t('close')}</button>`);
  const out = $('svOut'); out.value = exportCode();
  $('svCopy').onclick = async () => {
    sfx.click();
    try{ await navigator.clipboard.writeText(out.value); }
    catch(e){ out.focus(); out.select(); try{ document.execCommand('copy'); }catch(_){} }
    $('svCopy').textContent = t('copied');
    setTimeout(() => { const b = $('svCopy'); if (b) b.textContent = t('copy'); }, 1600);
  };
  $('svRestore').onclick = () => {
    sfx.click();
    if (importCode($('svIn').value)){ toast(t('importOk'), 1800); setTimeout(() => location.reload(), 900); }
    else toast(t('importBad'), 1800);
  };
  $('svClose').onclick = () => { sfx.click(); hideOverlay(); };
}

// first-ever level: show rules once, then point at a free arrow
function maybeTutorial(){
  if (store.get('ae_seen', false) || level !== 1) return;
  store.set('ae_seen', true);
  showHow();
  const prev = $('ovBtn').onclick;
  $('ovBtn').onclick = () => { prev(); setTimeout(() => giveHint(true), 350); };
}

// ============================== Home-screen icon ==============================
(function setIcon(){
  try{
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const g = c.getContext('2d');
    g.fillStyle = '#0F172A'; g.fillRect(0, 0, 180, 180);
    g.strokeStyle = '#22C55E'; g.fillStyle = '#22C55E'; g.lineWidth = 18; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(40, 120); g.lineTo(40, 70); g.lineTo(115, 70); g.stroke();
    g.beginPath(); g.moveTo(112, 40); g.lineTo(150, 70); g.lineTo(112, 100); g.closePath(); g.fill();
    const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png');
    document.head.appendChild(l);
    const l2 = document.createElement('link'); l2.rel = 'icon'; l2.href = l.href; document.head.appendChild(l2);
  }catch(e){}
})();

// ============================== Boot ==============================
(function boot(){
  const sv = store.get('ae_save', null);
  if (sv && sv.mode === 'daily' && sv.day === todayNum()) startGame('daily');
  else startGame('level', level);   // resumes a saved level automatically
  showHome();
})();
</script>
